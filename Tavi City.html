<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavi City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13294b; --signal:#f2c230; --teal:#1f8a8a; --red:#e04848; --green:#2e9b5f;
  --ink:#172238; --muted:#5a6680; --panel:rgba(250,251,252,0.94); --panel-solid:#fafbfc;
  --line:rgba(19,41,75,0.14); --chip:#eef2f7; --shadow:0 14px 40px rgba(8,18,40,.28);
  --scrim:rgba(10,20,40,.45); --btn:#13294b; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#eef2f8; --muted:#a8b3c7; --panel:rgba(18,26,42,0.93); --panel-solid:#121a2a;
    --line:rgba(255,255,255,0.13); --chip:#1d2840; --shadow:0 14px 40px rgba(0,0,0,.5);
    --scrim:rgba(2,6,14,.55); --btn:#f2c230; --btn-ink:#13294b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef2f8; --muted:#a8b3c7; --panel:rgba(18,26,42,0.93); --panel-solid:#121a2a;
  --line:rgba(255,255,255,0.13); --chip:#1d2840; --shadow:0 14px 40px rgba(0,0,0,.5);
  --scrim:rgba(2,6,14,.55); --btn:#f2c230; --btn-ink:#13294b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0e1a2e;color:var(--ink);
  font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Fredoka,Nunito,"Segoe UI",system-ui,sans-serif;font-weight:600;letter-spacing:.2px;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:.7rem 1.1rem;background:var(--chip);color:var(--ink);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
button.primary{background:var(--btn);color:var(--btn-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud[hidden]{display:none}
#mapWrap{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:256px;
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:3px solid var(--panel-solid);background:var(--panel-solid)}
#minimap{display:block;width:250px;height:250px}
#mapLabel{position:absolute;left:8px;bottom:6px;font:700 12px Nunito,sans-serif;color:#fff;background:rgba(19,41,75,.8);padding:2px 8px;border-radius:8px}
#stats{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:192px;background:var(--panel);
  border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
#stats .top{display:flex;justify-content:space-between;align-items:baseline}
#dayLabel{font-family:Fredoka,Nunito,sans-serif;font-size:14px;font-weight:600}
#clock{font-weight:800;color:var(--muted);font-size:12px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0}
.money div{background:var(--chip);border-radius:9px;padding:3px 7px}
.money small{display:block;color:var(--muted);font-size:10px;font-weight:700}
.money b{font-size:12px}
.bar{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;margin-top:3px;font-size:10px;font-weight:700;color:var(--muted)}
.track{height:7px;border-radius:5px;background:var(--chip);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .4s}
#hungerFill{background:linear-gradient(90deg,#e9a23b,#f2c230)}
#healthFill{background:linear-gradient(90deg,#e04848,#f07a6a)}
#happyFill{background:linear-gradient(90deg,#8e7cc3,#f2c230)}
.lifebtn{pointer-events:auto;width:100%;margin-top:0;padding:.3rem .2rem;font-size:11px;border-radius:9px}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pbtns button{padding:.45rem .75rem;font-size:13px}
.lifebtn kbd{background:var(--panel-solid);border-radius:5px;padding:0 4px;font-family:Fredoka,sans-serif;margin-left:2px;font-size:10px}
.dreams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dream{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:10px;border:2px solid var(--line);background:var(--panel-solid)}
.dream.on{border-color:var(--teal);background:var(--chip)}
.dream .e{font-size:24px}.dream small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.lifetop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lifetop div{background:var(--chip);border-radius:14px;padding:10px 12px}.lifetop small{display:block;color:var(--muted);font-weight:700}.lifetop b{font-family:Fredoka,sans-serif;font-size:22px;font-weight:600}
.achv{display:flex;flex-wrap:wrap;gap:8px;font-size:26px;margin-bottom:8px}.achv span{filter:grayscale(1);opacity:.3}.achv span.got{filter:none;opacity:1}
@media (max-width:600px){.dreams{grid-template-columns:1fr}}
#dateLine{font-size:10px;font-weight:700;color:var(--muted);margin-top:1px}
#jobLabel{margin-top:5px;font-size:10px;font-weight:700;color:var(--muted)}
#jobLabel b{color:var(--ink)}
#wanted{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:10px;font-weight:700;color:var(--muted)}
#stars b{font-size:12px;margin-left:1px}
#stars b.on{color:#f2c230;text-shadow:0 0 6px rgba(242,194,48,.6)}
#stars b.off{color:var(--ink);opacity:.18}
#wanted.evading #stars b.on{animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#prompt{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--panel);padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);font-weight:800;display:none;white-space:nowrap}
#prompt kbd{display:inline-block;background:var(--navy);color:#fff;border-radius:7px;padding:1px 8px;margin-right:8px;font-family:Fredoka,sans-serif}
#help{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:14px;
  padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
#help kbd{background:var(--chip);color:var(--ink);border-radius:6px;padding:0 6px;font-family:Fredoka,sans-serif}
#toasts{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,60vw)}
.toast{background:var(--panel);padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);font-weight:700;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Screens & panels */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--scrim);backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.card{background:var(--panel-solid);border-radius:24px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:28px}
.title-card{text-align:center;background:var(--navy);color:#fff;position:relative;overflow:hidden}
.title-card h1{font-size:clamp(40px,7vw,68px);line-height:1;color:var(--signal);font-weight:700}
.title-card p{color:#cdd8ea;max-width:38ch;margin:14px auto 22px;line-height:1.5}
.title-card .skyline{display:block;width:100%;height:70px;margin:-6px 0 14px}
.title-card button.primary{background:var(--signal);color:var(--navy);font-size:18px;padding:.85rem 2.2rem}
.title-card button.ghost{background:rgba(255,255,255,.12);color:#fff;margin-left:8px}
.title-card .pick{margin:0 auto 8px;font-weight:700;color:#cdd8ea}
.title-card .cloud{font-size:13px;margin:-6px auto 16px;color:#a9b8d0}
.linkbtn{background:none;color:#f2c230;padding:0;font-size:13px;text-decoration:underline;border-radius:4px}
input.txt{width:100%;font:inherit;font-weight:700;padding:.65rem .8rem;border-radius:12px;border:2px solid var(--line);background:var(--panel-solid);color:var(--ink);margin-bottom:8px}
.gender{display:flex;justify-content:center;gap:10px;margin-bottom:22px}
.gender button{background:rgba(255,255,255,.12);color:#fff;min-width:120px;font-size:17px;border:2px solid transparent}
.gender button.on{background:#f2c230;color:#13294b;border-color:#fff}
.card h2{font-size:26px;margin-bottom:6px}
.card .sub{color:var(--muted);margin:0 0 18px;line-height:1.5}
select{width:100%;font:inherit;font-weight:700;padding:.8rem;border-radius:12px;border:2px solid var(--line);background:var(--panel-solid);color:var(--ink);margin-bottom:6px}
.leads{font-size:14px;color:var(--muted);min-height:20px;margin-bottom:16px}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.progress{display:flex;gap:4px;margin:4px 0 18px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--chip)}
.progress i.done{background:var(--teal)}
.progress i.now{background:var(--signal)}
.qtext{font-size:21px;font-family:Fredoka,sans-serif;font-weight:500;line-height:1.35;margin:4px 0 18px}
.opts{display:grid;gap:10px}
.opts button{text-align:left;padding:14px 16px;border:2px solid var(--line);background:var(--panel-solid);font-weight:700}
.opts button:hover{border-color:var(--teal)}
.opts button.right{background:var(--green);border-color:var(--green);color:#fff}
.opts button.wrong{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:22px;margin-top:12px;font-weight:700}
.feedback.bad{color:var(--red)}
.offer{border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;width:100%;background:var(--panel-solid);text-align:left}
.offer:hover{border-color:var(--teal)}
.offer .ic{font-size:30px}
.offer b{display:block;font-size:17px}
.offer small{color:var(--muted);font-weight:700}
.note{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45;color:var(--muted)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.bal div{background:var(--chip);border-radius:14px;padding:10px 14px}
.bal small{display:block;color:var(--muted);font-weight:700}
.bal b{font-size:20px;font-family:Fredoka,sans-serif;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{background:transparent}
.seg button.on{background:var(--panel-solid);box-shadow:0 2px 8px rgba(0,0,0,.12)}
input[type=number]{width:100%;font:inherit;font-size:20px;font-weight:700;padding:.7rem .9rem;border-radius:12px;border:2px solid var(--line);background:var(--panel-solid);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.quick button{padding:.45rem .8rem;font-size:14px}
.meals{display:grid;gap:8px;margin-top:12px}
.meal{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--chip)}
.meal .e{font-size:28px;text-align:center}
.meal small{display:block;color:var(--muted);font-weight:700}
.msg{min-height:22px;font-weight:700;margin-top:10px}
.msg.bad{color:var(--red)}.msg.good{color:var(--green)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:10px 0}
.keys kbd{background:var(--chip);border-radius:7px;padding:2px 9px;font-family:Fredoka,sans-serif;text-align:center}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;margin:10px 0}

/* Barista shift */
#shift{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(860px,calc(100% - 24px));
  background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:16px;backdrop-filter:blur(8px)}
#shift[hidden]{display:none}
#work{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:16px;backdrop-filter:blur(8px)}
#work[hidden]{display:none}
#work .wq{font-family:Fredoka,sans-serif;font-size:19px;line-height:1.35;margin:0 0 12px}
#work .opts button{font-size:15px}
.casefile{background:#fffdf5;color:#2a2418;border-radius:12px;padding:14px 16px;border:2px dashed #d9c9a3;line-height:1.45}
.casefile h3{margin:0 0 6px}.casefile p{margin:6px 0 2px}.casefile ul{margin:0;padding-left:20px}
.shift-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shift-top b{font-family:Fredoka,sans-serif;font-size:20px;font-weight:600}
.shift-top small{display:block;color:var(--muted);font-weight:700}
.shift-body{display:grid;grid-template-columns:220px 1fr;gap:14px}
.ticket{background:#fffdf5;color:#2a2418;border-radius:12px;padding:14px;border:2px dashed #d9c9a3;font-family:Nunito,sans-serif}
.ticket small{color:#8a7a58;font-weight:700}
.ticket h3{font-size:20px;margin:2px 0}
.ticket p{margin:0 0 8px;font-weight:700;color:#6b5d40}
.ticket ul{list-style:none;padding:0;margin:0}
.ticket li{padding:3px 0;font-weight:700}
.ticket li::before{content:"○ ";color:#b8a679}
.ticket li.ok::before{content:"● ";color:#2e9b5f}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.dot{display:flex;align-items:center;gap:7px;padding:7px 11px 7px 7px;border-radius:999px;background:var(--chip);border:2px solid transparent;font-size:14px}
.dot i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.dot.on{border-color:var(--teal);background:var(--panel-solid)}
.dot .em{font-size:20px;line-height:1}
.lbl{font-size:13px;font-weight:800;color:var(--muted);margin:2px 0 6px}
.cup-row{display:flex;align-items:flex-end;gap:10px;margin-top:4px}
#cup{width:62px;height:76px;border:3px solid #c9c1b3;border-top:0;border-radius:0 0 16px 16px;display:flex;flex-direction:column-reverse;overflow:hidden;background:rgba(255,255,255,.4);position:relative}
#cup span{display:block;flex:1;max-height:22px}
#cup .plate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.cup-row .grow{flex:1}
@media (max-width:720px){
  .shift-body{grid-template-columns:1fr}
  #stats{width:170px;padding:7px 9px}
  #mapWrap{width:150px}#minimap{width:144px;height:144px}
  #help{display:none}
}
#speedo{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);text-align:center;min-width:96px}
#speedo[hidden]{display:none}
#mission{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:10px 18px;border-radius:16px;box-shadow:var(--shadow);text-align:center;max-width:min(600px,92vw)}
#mission[hidden]{display:none}
#mission b{display:block;font-family:Fredoka,sans-serif;font-size:17px;font-weight:600}
#mission span{font-size:13px;color:var(--muted);font-weight:700}
.holdbtn{width:100%;padding:18px;font-size:18px;user-select:none;-webkit-user-select:none;touch-action:none}
.monitor{background:#0d1b14;color:#3ee07a;font-family:ui-monospace,Menlo,monospace;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-weight:700}
#speedo b{display:block;font-family:Fredoka,sans-serif;font-size:30px;font-weight:600;line-height:1}
#speedo span{font-size:12px;font-weight:800;color:var(--muted)}
#speedo small{display:block;color:var(--red);font-weight:800;font-size:12px}
.cars{display:grid;gap:10px;margin:8px 0}
.carcard{background:var(--chip);border-radius:16px;padding:12px 14px;display:grid;gap:4px}
.carcard .ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.carcard .ctop b{font-size:17px}
.carcard p{margin:2px 0;font-size:14px;line-height:1.4}
.carcard small{color:var(--muted);font-weight:700}
.carcard .warn{color:var(--ink)}
.carcard button{justify-self:start;margin-top:4px}
.tag{background:var(--teal);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.cust{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.swatches{display:flex;gap:6px}
.sw{width:28px;height:28px;padding:0;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.dhead{font-size:17px;margin:18px 0 6px}
.qty{display:flex;align-items:center;gap:6px}.qty button{padding:.3rem .7rem;font-size:16px}.qty b{min-width:18px;text-align:center}
.notes{padding-left:0;list-style:none;display:grid;gap:8px;margin:12px 0}
.notes li{background:var(--chip);border-radius:12px;padding:10px 12px;line-height:1.45}
#touch{position:absolute;inset:0;pointer-events:none}
#touch[hidden]{display:none}
#stick{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(19,41,75,.28);border:3px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#tbtns{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
#tbtns button{width:64px;height:64px;border-radius:50%;background:rgba(19,41,75,.55);color:#fff;font-family:Fredoka,sans-serif;font-size:22px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border:2px solid rgba(255,255,255,.5);touch-action:manipulation;-webkit-user-select:none;user-select:none}
#tbtns button small{font-size:10px;font-family:Nunito,sans-serif;font-weight:800;margin-top:3px}
#tbtns button.big{background:rgba(242,194,48,.9);color:#13294b}
#tbtns button.on{background:rgba(31,138,138,.85)}
body.touch #prompt{pointer-events:auto;cursor:pointer;font-size:15px;padding:12px 18px;bottom:calc(170px + env(safe-area-inset-bottom,0px))}
body.touch #mission{bottom:calc(220px + env(safe-area-inset-bottom,0px))}
body.touch #speedo{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
body.touch #help{display:none}
body.touch #shift,body.touch #work{z-index:5}
canvas#c{touch-action:none}
html,body{overscroll-behavior:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){#fade{transition:none}.toast{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Tavi City game view"></canvas>

<div id="hud" hidden>
  <div id="mapWrap"><canvas id="minimap" width="500" height="500"></canvas><div id="mapLabel">Tavi City</div></div>
  <div id="stats">
    <div class="top"><span id="dayLabel">Monday</span><span id="clock">7:00 AM</span></div>
    <div id="dateLine"></div>
    <div class="money"><div><small>Cash</small><b id="cash">$0</b></div><div><small>Bank</small><b id="bankBal">$0</b></div></div>
    <div class="bar"><span>Hunger</span><div class="track"><i id="hungerFill"></i></div></div>
    <div class="bar"><span>Health</span><div class="track"><i id="healthFill"></i></div></div>
    <div class="bar"><span>Happy</span><div class="track"><i id="happyFill"></i></div></div>
    <div id="jobLabel"></div>

 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);return[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');}

function buildTraffic(){
 const cols=['#c0392b','#2e86de','#f5f5f5','#27ae60','#f39c12','#34495e','#8e44ad','#d35400','#7f8c8d','#16a085'];

const LOCKS=new Map();
function respawnCar(c){
 for(const L of c.locks)if(LOCKS.get(L.k)===c)LOCKS.delete(L.k);c.locks=[];
 for(let tries=0;tries<40;tries++){
  c.axis=Math.random()<.5?'x':'z';c.road=pick(R);c.dir=Math.random()<.5?1:-1;c.t=R[Math.floor(rand(0,R.length-1))]+rand(11,29);
  const sp=carSpot(c);
  if(S.stage==='city'&&Math.hypot(sp[0]-P.x,sp[1]-P.z)<60)continue;
  if(traffic.some(o=>{if(o===c)return false;const q=o.init?carSpot(o):[o.m.position.x,o.m.position.z];return Math.hypot(q[0]-sp[0],q[1]-sp[1])<12;}))continue;
  break;
 }
 c.init=true;c.stuck=0;c.cur=0;c.arc=null;c.plan=null;
}
function carSpot(c){const off=2.6*c.dir;return c.axis==='x'?[c.t,c.road+off]:[c.road-off,c.t];}
function nextInter(c){let best=null,bd=1e9;for(const q of R){const d=(q-c.t)*c.dir;if(d>.001&&d<bd){bd=d;best=q;}}return best;}
const TR=4.6;
function pickPlan(c,q){
 const lo=R[0]-.01,hi=R[R.length-1]+.01,ok=v=>v>=lo&&v<=hi,opts=[];
 if(ok(q+c.dir*40))opts.push({q,turn:false,w:3});
 for(const nd of[1,-1])if(ok(c.road+nd*40))opts.push({q,turn:true,axis:c.axis==='x'?'z':'x',road:q,dir:nd,w:1});
 let r=Math.random()*opts.reduce((a,o)=>a+o.w,0),ch=opts[0];for(const o of opts){r-=o.w;if(r<=0){ch=o;break;}}
 c.plan=ch;if(ch.turn)planTurn(c);return ch;
}
function planTurn(c){
 const p=c.plan,f1=c.axis==='x'?[c.dir,0]:[0,c.dir],f2=p.axis==='x'?[p.dir,0]:[0,p.dir];
 const cur=carSpot({axis:c.axis,road:c.road,dir:c.dir,t:0}),nw=carSpot({axis:p.axis,road:p.road,dir:p.dir,t:0});
 const cx=c.axis==='x'?nw[0]:cur[0],cz=c.axis==='x'?cur[1]:nw[1];
 const Sx=cx-f1[0]*TR,Sz=cz-f1[1]*TR,Ex=cx+f2[0]*TR,Ez=cz+f2[1]*TR,Cx=Sx+f2[0]*TR,Cz=Sz+f2[1]*TR;
 const a0=Math.atan2(Sz-Cz,Sx-Cx),a1=Math.atan2(Ez-Cz,Ex-Cx);let sw=a1-a0;sw=Math.atan2(Math.sin(sw),Math.cos(sw));
 p.startT=c.axis==='x'?Sx:Sz;p.endT=p.axis==='x'?Ex:Ez;p.arc={Cx,Cz,a0,sw,len:TR*Math.abs(sw),s:0};
}
function markPassed(c,q,axis,road){const kk=axis==='x'?q+','+road:road+','+q;for(const L of c.locks)if(L.k===kk)L.passed=true;}
function advanceCar(c,move){
 let guard=0;
 while(move>1e-6&&guard++<6){
  if(c.arc){const a=c.arc,rem=a.len-a.s;
   if(move<rem){a.s+=move;move=0;}
   else{move-=rem;const p=c.plan;markPassed(c,p.q,c.axis,c.road);c.axis=p.axis;c.road=p.road;c.dir=p.dir;c.t=p.endT;c.arc=null;c.plan=null;}
   continue;}
  const q=nextInter(c);
  if(q!==null&&!c.plan&&(q-c.t)*c.dir<16)pickPlan(c,q);
  if(c.plan&&c.plan.turn){const d=(c.plan.startT-c.t)*c.dir;if(move<d){c.t+=c.dir*move;move=0;}else{c.t=c.plan.startT;move-=Math.max(0,d);c.arc=c.plan.arc;c.arc.s=0;}continue;}
  const dist=q===null?Infinity:(q-c.t)*c.dir;
  if(move<dist){c.t+=c.dir*move;move=0;}else{c.t=q;move-=dist;markPassed(c,q,c.axis,c.road);c.plan=null;}
 }
}

function pedPos(p){const s=13.4,L=2*s,per=4*L;let t=((p.t%per)+per)%per;const side=Math.floor(t/L),u=t-side*L;
 if(side===0)return[p.cx-s+u,p.cz+s,Math.PI/2];if(side===1)return[p.cx+s,p.cz+s-u,Math.PI];if(side===2)return[p.cx+s-u,p.cz-s,-Math.PI/2];return[p.cx-s,p.cz-s+u,0];}

function policeModel(){const g=carModel('#f5f5f5','sedan');

 const red=new THREE.MeshStandardMaterial({color:'#ff2a2a',emissive:'#ff2020',emissiveIntensity:1}),blue=new THREE.MeshStandardMaterial({color:'#2a5cff',emissive:'#2d62ff',emissiveIntensity:1});
 const ly=g.userData.roofY+.1,lz=g.userData.roofZ||-.3;box(.25,.08,1.2,mat('#222'),0,ly-.05,lz,g,false);box(.6,.16,.32,red,-.35,ly+.03,lz,g,false);box(.6,.16,.32,blue,.35,ly+.03,lz,g,false);
 g.userData.red=red;g.userData.blue=blue;scene.add(g);return g;}
const nodeOk=v=>v>=R[0]-.01&&v<=R[R.length-1]+.01;
function nearestNode(x,z){const n=v=>clamp(Math.round(v/40)*40,R[0],R[R.length-1]);return[n(x),n(z)];}
function spawnPolice(){
 const nodes=[];for(const a of R)for(const b of R){const d=Math.hypot(a-P.x,b-P.z);if(d>55&&d<110)nodes.push([a,b]);}
 if(!nodes.length)for(const a of R)for(const b of R)nodes.push([a,b]);
 const n=pick(nodes),m=policeModel();
 const pc={m,x:n[0],z:n[1],h:Math.atan2(P.x-n[0],P.z-n[1]),sp:0,wp:null,prev:null,stuckT:0,gridT:0,revT:0,leaving:false,leaveT:0};
 m.position.set(pc.x,.02,pc.z);police.push(pc);
}
function removePolice(pc){scene.remove(pc.m);police.splice(police.indexOf(pc),1);}
function updateStars(){const el=$('stars');if(!el)return;el.innerHTML=Array.from({length:6},(_,i)=>`<b class="${i<S.wanted?'on':'off'}">★</b>`).join('');el.setAttribute('aria-label',`Wanted level ${S.wanted} of 6`);}
function addWanted(n,why){
 const before=S.wanted;S.wanted=Math.min(6,S.wanted+n);evadeT=0;
 if(S.wanted>before){tone([660,880,660,880],'square',.05);toast(`${why} Wanted level: ${'★'.repeat(S.wanted)}`,3500);}
 updateStars();save();
}
function policeTarget(){if(S.inside){const d=doors.find(x=>x.id===roomDoor(S.inside));return[d.x,d.z];}return[P.x,P.z];}
function updatePolice(dt,now){
 const active=police.filter(p=>!p.leaving);
 if(S.wanted>active.length){spawnT-=dt;if(spawnT<=0){spawnPolice();spawnT=1.5;}}
 else if(active.length>S.wanted)active[active.length-1].leaving=true;
 const tgt=policeTarget(),tx0=tgt[0],tz0=tgt[1];let nearestCop=1e9;
 for(const pc of police.slice()){
  const dist=Math.hypot(tx0-pc.x,tz0-pc.z);
  if(pc.leaving){pc.leaveT+=dt;if(pc.leaveT>12||dist>80){removePolice(pc);continue;}}else nearestCop=Math.min(nearestCop,dist);
  pc.gridT-=dt;
  const direct=!pc.leaving&&!S.inside&&dist<24&&pc.gridT<=0;
  let tx,tz;
  if(direct){tx=tx0;tz=tz0;pc.wp=null;}
  else{
   if(!pc.wp){pc.wp=nearestNode(pc.x,pc.z);pc.prev=null;}
   if(Math.hypot(pc.wp[0]-pc.x,pc.wp[1]-pc.z)<4){
    const a=pc.wp[0],b=pc.wp[1];let opts=[[a+40,b],[a-40,b],[a,b+40],[a,b-40]].filter(o=>nodeOk(o[0])&&nodeOk(o[1]));
    if(pc.prev&&opts.length>1)opts=opts.filter(o=>!(o[0]===pc.prev[0]&&o[1]===pc.prev[1]));
    const score=o=>Math.hypot(o[0]-tx0,o[1]-tz0)*(pc.leaving?-1:1)+Math.random()*6;
    opts.sort((p,q)=>score(p)-score(q));pc.prev=pc.wp;pc.wp=opts[0];
   }
   tx=pc.wp[0];tz=pc.wp[1];
  }
  let dh=Math.atan2(tx-pc.x,tz-pc.z)-pc.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));
  const maxSp=pc.leaving?12:10+S.wanted*1.8;let targetSp;
  if(pc.revT>0){pc.revT-=dt;targetSp=-5;pc.h-=Math.sign(dh||1)*1.5*dt;}
  else{pc.h+=clamp(dh,-2.6*dt,2.6*dt);
   if(S.inside&&dist<8)targetSp=0;
   else if(direct)targetSp=dist<5?Math.max(1.5,dist*1.2):maxSp;
   else targetSp=Math.abs(dh)>.9?maxSp*.35:maxSp;}
  pc.sp+=(targetSp-pc.sp)*Math.min(1,dt*2.2);
  const ox=pc.x,oz=pc.z;
  let nx=pc.x+Math.sin(pc.h)*pc.sp*dt,nz=pc.z+Math.cos(pc.h)*pc.sp*dt;
  [nx,nz]=resolve(nx,nz,1.3);
  for(const o of traffic){const ddx=nx-o.m.position.x,ddz=nz-o.m.position.z,d=Math.hypot(ddx,ddz);if(d<2.6&&d>0){nx=o.m.position.x+ddx/d*2.6;nz=o.m.position.z+ddz/d*2.6;}}
  for(const o of police){if(o===pc)continue;const ddx=nx-o.x,ddz=nz-o.z,d=Math.hypot(ddx,ddz);if(d<2.8&&d>0){nx=o.x+ddx/d*2.8;nz=o.z+ddz/d*2.8;}}
  pc.x=clamp(nx,-BOUND,BOUND);pc.z=clamp(nz,-BOUND,BOUND);
  const moved=Math.hypot(pc.x-ox,pc.z-oz);
  if(pc.revT<=0&&Math.abs(targetSp)>3&&moved<Math.abs(pc.sp)*dt*.3+.002){pc.stuckT+=dt;if(pc.stuckT>1.2){pc.stuckT=0;pc.revT=.9;pc.gridT=4;pc.wp=nearestNode(pc.x,pc.z);pc.prev=null;}}else pc.stuckT=Math.max(0,pc.stuckT-dt);
  pc.m.position.set(pc.x,groundY(pc.x,pc.z)+.02,pc.z);pc.m.rotation.y=pc.h;
  const f=Math.floor(now/180)%2;pc.m.userData.red.emissiveIntensity=f?2.2:.15;pc.m.userData.blue.emissiveIntensity=f?.15:2.2;
  if(!pc.leaving&&!S.inside&&dist<(S.driving?4:3.3)){if((S.onBike||S.driving)&&Math.abs(P.speed)>8)P.speed*=.5;else bustT+=dt;}
 }
 bustT=Math.max(0,bustT-dt*.5);
 if(bustT>1.1){busted();return;}
 if(S.wanted>0){
  if(nearestCop<40&&!S.inside)evadeT=0;else evadeT+=dt*(S.inside?1.5:1);
  if(evadeT>8+S.wanted*2){evadeT=0;S.wanted--;updateStars();save();toast(S.wanted?`You lost a star. Wanted level: ${'★'.repeat(S.wanted)}`:'You escaped the police! 😮‍💨',3500);}
 }
 $('wanted').classList.toggle('evading',S.wanted>0&&evadeT>2);
}

 else if(H&&H.kind!=='own'&&S.day>=H.nextDue){const T=HOMES[H.tier],base=(T.rent||T.pay)+(H.rentAdd||0),amt=base+(H.late?250:0),what=H.kind==='rent'?'rent':'mortgage payment';

function choiceBlock(q,opts,onPick,retry){
 $('wBody').innerHTML=`<p class="wq">${q}</p><div class="opts">${opts.map((o,i)=>`<button data-w="${i}">${o.t}</button>`).join('')}</div><div class="msg" id="wMsg"></div><div class="row-end" id="wNext"></div>`;
 let done=false;
 $('wBody').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(done)return;const o=opts[+b.dataset.w];
  if(retry&&!o.ok){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');buzz();onPick(o,b,false);return;}
  done=true;b.classList.add(o.ok?'right':'wrong');if(!o.ok){const good=[...$('wBody').querySelectorAll('[data-w]')].find(x=>opts[+x.dataset.w].ok);if(good)good.classList.add('right');}
  (o.ok?ding:buzz)();onPick(o,b,true);});}
function nextBtn(label,fn){$('wNext').innerHTML=`<button class="primary" id="wGo">${label}</button>`;$('wGo').onclick=fn;$('wGo').focus();}

const LAW_SEAT={x:1606,z:-1.4,h:Math.PI},COURT_SEAT={x:1696.5,z:-.4,h:Math.PI};
function lawStart(){
 if(S.job!=='lawyer'){toast('This office belongs to a Taylor Law Firm lawyer.');return;}
 const why=canWork('lawyer');if(why){toast(why,4000);return;}
 if(!S.jobProg||S.jobProg.kind!=='lawyer')S.jobProg={kind:'lawyer',c:Math.floor(Math.random()*CASES.length),round:0,score:0,stage:'file'};
 work.active=true;work.kind='lawyer';
 if(S.jobProg.stage==='trial'){goCourt();return;}
 fade(()=>{P.x=LAW_SEAT.x;P.z=LAW_SEAT.z;P.h=LAW_SEAT.h;work.seat={x:LAW_SEAT.x,y:-.45,z:LAW_SEAT.z,h:LAW_SEAT.h,sit:true};work.cam=new THREE.Vector3(1606,2.6,1.6);work.look=new THREE.Vector3(1606,1,-3.2);caseFile();});}
function caseFile(){if(!S.jobProg)return;const C=CASES[S.jobProg.c];workShow('Taylor Law Firm, Level 3','Today\'s case file');
 $('wBody').innerHTML=`<div class="casefile"><h3>📁 ${C.t}</h3><p><b>Client:</b> ${C.c}. ${C.side}</p><p><b>Facts</b></p><ul>${C.f.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Evidence you can use</b></p><ul>${C.e.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="row-end" id="wNext"></div>`;
 nextBtn('Go to court ⚖️',()=>{S.jobProg.stage='trial';save();goCourt();});}
function goCourt(){work.active=true;work.kind='lawyer';
 fade(()=>{S.inside='court';P.x=COURT_SEAT.x;P.z=COURT_SEAT.z;P.h=COURT_SEAT.h;work.seat={x:COURT_SEAT.x,y:-.45,z:COURT_SEAT.z,h:COURT_SEAT.h,sit:true};work.cam=new THREE.Vector3(1694.2,3.2,3.6);work.look=new THREE.Vector3(1700,2.2,-7.5);trialRound();});}
function trialRound(){const p=S.jobProg;if(!p)return;const C=CASES[p.c];if(p.round>=3){verdict();return;}
 const R0=C.r[p.round];workShow(`Tavi City Court: ${C.t}`,`${R0[0]} (${p.round+1} of 3)`);
 const opts=shuffle(R0[1].map(o=>({t:o[0],ok:o[1]===2,pts:o[1],re:o[2]})));
 $('wBody').innerHTML='';choiceBlock(`<b>${R0[0]}.</b> What do you say?`,opts,(o)=>{p.score+=o.pts;p.round++;$('wMsg').className='msg '+(o.pts===2?'good':o.pts===1?'':'bad');$('wMsg').textContent=(o.pts===2?'👍 ':o.pts===1?'🤔 ':'😬 ')+o.re;save();nextBtn(p.round>=3?'Hear the verdict':'Continue',trialRound);});}
function verdict(){const p=S.jobProg,C=CASES[p.c],win=p.score>=4,pay=JOBS.lawyer.pay;
 if(win){payDay('lawyer');}else{S.pendingPay=r2((S.pendingPay||0)+pay);S.worked=true;S.jobProg=null;save();}
 workShow(`Tavi City Court: ${C.t}`,'Verdict');
 $('wBody').innerHTML=`<p class="wq">${win?'🏆 <b>You won the case!</b> The judge rules in favor of your client.':'⚖️ <b>You lost the case.</b> The judge rules against your client.'}</p><p class="sub">${win?`Great work. Your pay of ${fmt(pay)} was deposited and you can head home.`:`You won't get paid until tomorrow. Your ${fmt(pay)} will be deposited tomorrow morning.`}</p><div class="row-end" id="wNext"></div>`;
 nextBtn('Leave the courthouse',()=>{workEnd();fade(()=>{const d=doors.find(x=>x.id==='law');S.inside='';P.x=d.x;P.z=d.z+.4;P.h=0;P.y=groundY(P.x,P.z);save();});});
 (win?chaching:buzz)();}

function mechStart(){
 const why=canWork('mechanic');if(why){toast(why,4000);return;}
 if(!S.jobProg||S.jobProg.kind!=='mechanic')S.jobProg={kind:'mechanic',car:0,fix:0,probs:shuffle(MECH_Q.map((_,i)=>i)).slice(0,3)};
 closePanel();work.active=true;work.kind='mechanic';
 fade(()=>{S.driving=false;if(ownCar&&carInBay())ownCar.visible=false;P.x=63.6;P.z=-58.2;P.h=-Math.PI/2;work.seat={x:63.6,y:groundY(63.6,-58.2),z:-58.2,h:-Math.PI/2,sit:false};
  work.cam=new THREE.Vector3(67.5,3.4,-51.8);work.look=new THREE.Vector3(60,.9,-58.5);spawnMechCar();mechNext();});}
function spawnMechCar(){if(mechCar)scene.remove(mechCar);const st=pick(['sedan','suv','sport','sedan']);mechCar=carModel(pick(['#c0392b','#2e86de','#f5f5f5','#27ae60','#34495e','#d35400','#8e44ad']),st);
 mechCar.position.set(60,.32,-58.5);mechCar.rotation.y=Math.PI;const pr=CAR_PROFILES[st];const hood=box(pr.W*.8,.05,1.15,paintMat('#888888'),0,0,0,mechCar,false);hood.material=mechCar.children[0].material;hood.position.set(0,pr.body[3][1]+.55,pr.body[3][0]-.55);hood.rotation.x=-1.0;scene.add(mechCar);}
function mechNext(){const p=S.jobProg;if(!p)return;
 if(p.fix>=3){p.car++;p.fix=0;p.probs=shuffle(MECH_Q.map((_,i)=>i)).slice(0,3);save();
  if(p.car>=5){const pay=payDay('mechanic');workEnd();P.x=63.8;P.z=-56;P.h=0;openPanel(`<h2>🔧 Shift complete!</h2><p class="sub">You fixed 5 cars today. Your pay of <b>${fmt(pay)}</b> was deposited into your bank account.</p><div class="row-end"><button class="primary" id="ok">Nice</button></div>`);$('ok').onclick=closePanel;return;}
  spawnMechCar();}
 const q=MECH_Q[p.probs[p.fix]];workShow('Automotive Repair Shop',`Car ${p.car+1} of 5  ·  Problem ${p.fix+1} of 3`);
 const opts=shuffle(q[1].map((t,i)=>({t,ok:i===0})));
 choiceBlock(`🚗 ${q[0]}`,opts,(o,b,final)=>{if(!final){$('wMsg').className='msg bad';$('wMsg').textContent="That didn't fix it. Try something else.";return;}
  p.fix++;save();$('wMsg').className='msg good';$('wMsg').textContent='✅ Fixed! '+q[2];nextBtn(p.fix>=3?(p.car>=4?'Finish the shift':'Car done! Next car'):'Next problem',mechNext);},true);}

 const jobs=Object.keys(JOBS).map(j=>{const J=JOBS[j],cur=S.job===j,q=qualified(j);
  return `<div class="meal"><span class="e">${J.icon||'🚗'}</span><span><b>${J.title}</b><small>${fmt(J.pay)} a day, ${REQ[j]?`needs a ${MAJORS.find(m=>m.id===REQ[j]).name} degree`:'no degree needed'}</small></span>${cur?'<span class="tag">Your job</span>':q?`<button data-job="${j}">Switch</button>`:'<button disabled>Need degree</button>'}</div>`;}).join('');

  $('panel').querySelector('.card').innerHTML=`<h2>${J.icon||'🚗'} You're now a ${J.title}!</h2><p class="sub">You'll earn ${fmt(J.pay)} a day at ${J.place}. ${BUILT_JOBS.includes(j)?'Your new workplace is marked on your map.':'Your workday for this job arrives in a coming update. Until then, you can pick up shifts at Havis Coffee ☕.'}</p><div class="row-end"><button class="primary" id="ok">Okay</button></div>`;$('ok').onclick=closePanel;});

function classQuiz(k){const st=S.study,idx=st.n*2+k,q=Q[st.major][idx],opts=shuffle([q[1]].concat(q[2]));

/* ================= STREET LIGHTS: lamps along every street with real light pools at night ================= */
const LAMPS=[];let lampPools=null,nightF=0,lampSort=0,nearLamps=[];
function buildStreetLights(){
 const T=[];for(const c of BC){T.push(c-11,c+11);}
 for(const r of R)for(const t of T)for(const sd of[-1,1]){
  const a=[t,r+sd*6.2,-sd,'x'],b=[r+sd*6.2,t,-sd,'z'];
  for(const[x,z,dir,ax]of[a,b]){if(Math.abs(x)>167||Math.abs(z)>167)continue;LAMPS.push({x,z,ry:ax==='x'?(dir>0?0:Math.PI):(dir>0?Math.PI/2:-Math.PI/2)});}}
 const n=LAMPS.length,dm=new THREE.Object3D(),pm2=mat('#2f3338',{metalness:.6,roughness:.4});
 const head=new THREE.MeshStandardMaterial({color:'#fff6d8',emissive:'#ffd98a',emissiveIntensity:0});STREET_HEADS.push(head);
 const poles=new THREE.InstancedMesh(new THREE.CylinderGeometry(.07,.11,5.6,8),pm2,n),arms=new THREE.InstancedMesh(new THREE.BoxGeometry(.07,.07,1.3),pm2,n),heads=new THREE.InstancedMesh(new THREE.BoxGeometry(.32,.12,.55),head,n);
 const poolTex=canvasTex(128,128,(g,W,H)=>{const gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);gr.addColorStop(0,'rgba(255,214,150,1)');gr.addColorStop(.45,'rgba(255,200,130,.45)');gr.addColorStop(1,'rgba(255,190,120,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);});
 const poolMat=new THREE.MeshBasicMaterial({map:poolTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
 lampPools=new THREE.InstancedMesh(new THREE.PlaneGeometry(9,9).rotateX(-Math.PI/2),poolMat,n);
 LAMPS.forEach((L,i)=>{const gy=groundY(L.x,L.z);const fx=Math.sin(L.ry),fz=Math.cos(L.ry);
  dm.rotation.set(0,L.ry,0);dm.position.set(L.x,gy+2.8,L.z);dm.updateMatrix();poles.setMatrixAt(i,dm.matrix);
  dm.position.set(L.x+fx*.62,gy+5.55,L.z+fz*.62);dm.updateMatrix();arms.setMatrixAt(i,dm.matrix);
  dm.position.set(L.x+fx*1.25,gy+5.48,L.z+fz*1.25);dm.updateMatrix();heads.setMatrixAt(i,dm.matrix);
  L.hx=L.x+fx*1.25;L.hz=L.z+fz*1.25;dm.rotation.set(0,0,0);dm.position.set(L.hx,.36,L.hz);dm.updateMatrix();lampPools.setMatrixAt(i,dm.matrix);
  addCol(L.x,L.z,.3,.3);});
 poles.castShadow=arms.castShadow=true;lampPools.renderOrder=2;for(const m of[poles,arms,heads,lampPools])scene.add(m);}
function streetLightUpdate(dt){for(const m of STREET_HEADS)m.emissiveIntensity=.15+nightF*.75;if(!lampPools)return;lampPools.material.opacity=Math.min(.36,nightF*.45);
 lampSort-=dt;if(lampSort<=0){lampSort=.5;let bx=P.x,bz=P.z;if(S.stage!=='city'){bx=camera.position.x;bz=camera.position.z;}
  nearLamps=LAMPS.map(L=>[L,(L.hx-bx)**2+(L.hz-bz)**2]).sort((a,b)=>a[1]-b[1]).slice(0,3).map(a=>a[0]);}}

function gridRoute(a,b){const N=R.length,id=(i,j)=>i*N+j,nodes=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)nodes.push([R[i],R[j]]);
 const adj=nodes.map(()=>[]);const link=(u,v)=>{const w=Math.hypot(nodes[u][0]-nodes[v][0],nodes[u][1]-nodes[v][1]);adj[u].push([v,w]);adj[v].push([u,w]);};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(i+1<N)link(id(i,j),id(i+1,j));if(j+1<N)link(id(i,j),id(i,j+1));}
 const attach=p=>{const k=nodes.length;nodes.push([p.x,p.z]);adj.push([]);if(p.axis==='x'){const j=R.indexOf(p.z);let i0=0;while(i0<N-2&&R[i0+1]<=p.x)i0++;link(k,id(i0,j));link(k,id(i0+1,j));}else{const i=R.indexOf(p.x);let j0=0;while(j0<N-2&&R[j0+1]<=p.z)j0++;link(k,id(i,j0));link(k,id(i,j0+1));}return k;};
 const A=attach(a),B=attach(b);const dist=nodes.map(()=>1e12),prev=nodes.map(()=>-1),done=nodes.map(()=>false);dist[A]=0;
 for(;;){let u=-1;for(let k=0;k<nodes.length;k++)if(!done[k]&&(u<0||dist[k]<dist[u]))u=k;if(u<0||u===B||dist[u]>=1e12)break;done[u]=true;for(const[v,w]of adj[u])if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}}
 const out=[];for(let u=B;u>=0;u=prev[u])out.unshift(nodes[u]);const pts=[out[0]];for(let k=1;k<out.length;k++){const p=pts[pts.length-1],q=out[k];if(Math.hypot(q[0]-p[0],q[1]-p[1])>.01)pts.push(q);}
 const simp=[pts[0]];for(let k=1;k<pts.length-1;k++){const a0=simp[simp.length-1],b0=pts[k],c0=pts[k+1];if(!((Math.abs(a0[0]-b0[0])<.01&&Math.abs(b0[0]-c0[0])<.01)||(Math.abs(a0[1]-b0[1])<.01&&Math.abs(b0[1]-c0[1])<.01)))simp.push(b0);}simp.push(pts[pts.length-1]);
 // shift into the right-hand lane
 const n=simp.length,lane=[];const dirs=[];for(let k=0;k<n-1;k++){const dx=simp[k+1][0]-simp[k][0],dz=simp[k+1][1]-simp[k][1],L=Math.hypot(dx,dz)||1;dirs.push([dx/L,dz/L]);}
 for(let k=0;k<n;k++){const dA=dirs[Math.max(0,k-1)],dB=dirs[Math.min(dirs.length-1,k)];const nA=[-dA[1]*2.6,dA[0]*2.6],nB=[-dB[1]*2.6,dB[0]*2.6];let x=simp[k][0],z=simp[k][1];
  if(k===0){x+=nB[0];z+=nB[1];}else if(k===n-1){x+=nA[0];z+=nA[1];}else{x+=(Math.abs(dA[0])>.5?nB[0]:nA[0]);z+=(Math.abs(dA[0])>.5?nA[1]:nB[1]);}lane.push([x,z]);}
 return mkPath(lane,false);}

addEventListener('keydown',e=>{
 if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'))return;

addEventListener('keyup',e=>{keys[e.code]=false;});

 if(S.onBike){S.onBike=false;const sx=Math.cos(P.h)*1.1,sz=-Math.sin(P.h)*1.1;let[nx,nz]=resolve(P.x+sx,P.z+sz,.45);P.x=nx;P.z=nz;P.speed=0;toast('Off the bike');save();return;}
 const d=Math.hypot(bike.position.x-P.x,bike.position.z-P.z),dc=ownCar?Math.hypot(ownCar.position.x-P.x,ownCar.position.z-P.z):1e9;

 // traffic: cars stay on the road grid, obey traffic lights, and turn at intersections
